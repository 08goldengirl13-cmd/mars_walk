<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Mars Walk: replay NASA Curiosity's real 38 km route in Gale Crater, climb the rock layers of Mount Sharp and plan your own walk on Mars. A NASA Space Apps Challenge project built with NASA Mars Trek maps and MSL waypoint data.">
  <meta name="theme-color" content="#0B0D1A">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mars Walk — walk 38 km on Mars in 30 seconds">
  <meta property="og:description" content="Replay NASA Curiosity's real journey in Gale Crater, climb through billions of years of Martian history and decide how far you would dare to walk. Built on NASA open data.">
  <meta property="og:site_name" content="Mars Walk">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Mars Walk — walk 38 km on Mars in 30 seconds">
  <meta name="twitter:description" content="Replay NASA Curiosity's real journey in Gale Crater using NASA open data.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Mars Walk">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Mars Walk — NASA Space Apps</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B0D1A; }
  </style>

  <script src="flutter_bootstrap.js" async></script>
